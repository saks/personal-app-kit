[package]
name = "kit-db"
description = "Host-only Turso helpers: sea-query execution, row readers, transactions, CA bundle, env overrides, UtcMillis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Host only (Tauri side). On wasm32 the crate is empty, so `make check`'s
# wasm32 clippy over the whole workspace never builds turso.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kit-core = { workspace = true }
turso = { workspace = true }
sea-query = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
webpki-root-certs = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
