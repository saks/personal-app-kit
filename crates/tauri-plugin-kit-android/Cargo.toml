[package]
name = "tauri-plugin-kit-android"
description = "Tauri 2 mobile plugin: the shared WorkManager background-sync job (SyncWorker) and its JNI glue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
# Tauri plugin convention: tauri-build reads DEP_TAURI_PLUGIN_KIT_ANDROID_ANDROID_LIBRARY_PATH
# and adds `android/` to the app's Gradle build.
links = "tauri-plugin-kit-android"

# Each dependency sits under the cfg its code compiles for (see `src/lib.rs`),
# so no target builds one it doesn't use.
# `config` (LogTag, const_str): every target but wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kit-core = { workspace = true }

# The worker side (`jni_glue`, `worker`): Android only in normal builds.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
ndk-context = { workspace = true }
tracing = { workspace = true }

# Host tests compile the JNI glue (OB's `cfg(any(target_os = "android", test))`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jni = { workspace = true }
ndk-context = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
