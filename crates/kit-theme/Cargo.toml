[package]
name = "kit-theme"
description = "Shared daisyUI theme set: prefs types, Yew ThemeProvider, boot script and theme CSS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# ThemeProvider, use_theme, data-theme apply, localStorage mirror, SystemBars.
yew = ["dep:yew", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
kit-core = { workspace = true }
serde = { workspace = true }
yew = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
