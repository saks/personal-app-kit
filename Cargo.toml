[workspace]
# Every directory under crates/ is a member, so adding a crate never edits this file.
members = ["crates/*"]
# Same resolver the apps get from their edition-2024 root packages.
resolver = "3"

[workspace.package]
# One version for every kit crate. All crates release together under one tag (RELEASING.md).
version = "0.1.0"
edition = "2024"
# Edition 2024 plus let-chains, which the apps' build.rs already uses.
rust-version = "1.88"
publish = false
repository = "https://github.com/saks/personal-app-kit"

[workspace.dependencies]
kit-core = { path = "crates/kit-core" }
# kit-db (host only). turso is pinned exactly: both apps' replicas and
# kit-db's busy classification depend on 0.8.3 behaviour.
turso = { version = "=0.8.3", default-features = false }
sea-query = { version = "1", default-features = false, features = ["backend-sqlite", "thread-safe"] }
thiserror = "2"
tracing = "0.1"
webpki-root-certs = "1"
base64 = "0.23"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["now"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "MediaQueryList", "EventTarget"] }
js-sys = "0.3"

[workspace.lints.rust]
# `forbid` makes `#[allow(dead_code)]` and `#[expect(dead_code)]` hard errors.
dead_code = "forbid"

[workspace.lints.clippy]
# No unwrap, expect or panic outside tests (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
